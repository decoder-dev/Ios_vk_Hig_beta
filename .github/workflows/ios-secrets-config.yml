name: Prepare VK config (no secret echo)

# Writes a gitignored-style Secrets.xcconfig artifact for Mac runners.
# Requires repo Actions secrets: VK_ID_CLIENT_ID, VK_ID_CLIENT_SECRET
# Does not print secret values.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ios-secrets-config.yml"
      - "VKHIG/Config/**"
      - "scripts/write_secrets_xcconfig.sh"

jobs:
  prepare-config:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Ensure secrets are present (names only)
        env:
          HAS_ID: ${{ secrets.VK_ID_CLIENT_ID != '' }}
          HAS_SECRET: ${{ secrets.VK_ID_CLIENT_SECRET != '' }}
        run: |
          echo "VK_ID_CLIENT_ID configured: $HAS_ID"
          echo "VK_ID_CLIENT_SECRET configured: $HAS_SECRET"
          if [ "$HAS_ID" != "true" ] || [ "$HAS_SECRET" != "true" ]; then
            echo "::warning::Add VK_ID_CLIENT_ID and VK_ID_CLIENT_SECRET in repo Settings → Secrets and variables → Actions"
            exit 0
          fi

      - name: Materialize Secrets.xcconfig from Actions secrets
        if: ${{ secrets.VK_ID_CLIENT_ID != '' && secrets.VK_ID_CLIENT_SECRET != '' }}
        env:
          VK_ID_CLIENT_ID: ${{ secrets.VK_ID_CLIENT_ID }}
          VK_ID_CLIENT_SECRET: ${{ secrets.VK_ID_CLIENT_SECRET }}
        run: |
          chmod +x scripts/write_secrets_xcconfig.sh
          ./scripts/write_secrets_xcconfig.sh VKHIG/Config/Secrets.xcconfig
          # Never cat the file; only confirm it exists and is non-empty
          test -s VKHIG/Config/Secrets.xcconfig
          echo "Secrets.xcconfig written ($(wc -c < VKHIG/Config/Secrets.xcconfig) bytes) — contents not logged"

      - name: Upload Secrets.xcconfig artifact (restricted)
        if: ${{ secrets.VK_ID_CLIENT_ID != '' && secrets.VK_ID_CLIENT_SECRET != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: vkhig-secrets-xcconfig
          path: VKHIG/Config/Secrets.xcconfig
          if-no-files-found: ignore
          retention-days: 1
