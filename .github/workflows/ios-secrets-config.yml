name: iOS build and tests
on:
  workflow_dispatch:
    inputs:
      only_ios:
        description: Simulator version
        type: choice
        default: all
        options: [all, '18', '27']
      only_unit:
        description: Compile app and run unit tests only
        type: boolean
        default: false
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ios-${{ github.ref }}-matrix-${{ github.event.inputs.only_ios || 'all' }}-${{ github.event.inputs.only_unit || 'false' }}
  cancel-in-progress: true
jobs:
  build-test:
    name: iOS ${{ matrix.ios }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(github.event.inputs.only_ios == '27' && '[{"runner":"xcode-27","ios":"27"}]' || github.event.inputs.only_ios == '18' && '[{"runner":"macos-15-intel","ios":"18"}]' || '[{"runner":"macos-15-intel","ios":"18"},{"runner":"xcode-27","ios":"27"}]') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      REQUIRED_IOS: ${{ matrix.ios }}
      ONLY_UNIT: ${{ github.event.inputs.only_unit || 'false' }}
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 27 when requested
        if: matrix.ios == '27'
        run: |
          set -euo pipefail
          for candidate in /Applications/Xcode*.app; do
            version=$(DEVELOPER_DIR="$candidate/Contents/Developer" xcodebuild -version | sed -n '1p')
            if [[ "$version" == 'Xcode 27'* ]]; then
              echo "DEVELOPER_DIR=$candidate/Contents/Developer" >> "$GITHUB_ENV"
              exit 0
            fi
          done
          echo 'Xcode 27 is unavailable on this runner' >&2
          exit 1
      - name: Install project generator
        run: brew install xcodegen
      - name: Configure public client ID
        env:
          VK_ID_CLIENT_ID: ${{ secrets.VK_ID_CLIENT_ID }}
        run: |
          bash scripts/write_secrets_xcconfig.sh
          xcodegen generate
          xcodebuild -version
      - name: Build and test on requested iPhone simulator
        run: |
          set -euo pipefail
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys,os; d=json.load(sys.stdin); version=os.environ["REQUIRED_IOS"]; candidates=[x["udid"] for runtime,devices in d["devices"].items() if ("iOS-"+version+"-") in runtime for x in devices if "iPhone" in x["name"]]; print(candidates[0] if candidates else "")')
          [[ -n "$DEVICE" ]] || { echo "Requested iOS simulator is missing" >&2; exit 1; }
          TEST_FILTER=(test)
          if [[ "$ONLY_UNIT" == true ]]; then TEST_FILTER+=("-only-testing:VKHIGTests"); fi
          xcodebuild -scheme VKHIG -destination "platform=iOS Simulator,id=$DEVICE" -resultBundlePath TestResults.xcresult CODE_SIGNING_ALLOWED=NO SWIFT_ENABLE_BATCH_MODE=NO OTHER_SWIFT_FLAGS="-Xfrontend -warn-long-expression-type-checking=500 -Xfrontend -warn-long-function-bodies=2000" "${TEST_FILTER[@]}"
      - name: Export test screenshots
        if: always() && github.event.inputs.only_unit != 'true'
        run: |
          if [[ -d TestResults.xcresult ]]; then
            xcrun xcresulttool export attachments --path TestResults.xcresult --output-path Screenshots
          fi
      - name: Upload test results and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-${{ matrix.ios }}-test-results
          path: |
            TestResults.xcresult
            Screenshots
          retention-days: 7
