name: iOS build and tests
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ios-${{ github.ref }}-single-file
  cancel-in-progress: true
jobs:
  build-test:
    runs-on: macos-15-intel
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install project generator
        run: brew install xcodegen
      - name: Configure public client ID
        env:
          VK_ID_CLIENT_ID: ${{ secrets.VK_ID_CLIENT_ID }}
        run: |
          bash scripts/write_secrets_xcconfig.sh
          xcodegen generate
      - name: Build and test on available iPhone simulator
        run: |
          set -euo pipefail
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for devices in d["devices"].values() for x in devices if "iPhone" in x["name"]))')
          xcodebuild -scheme VKHIG -destination "platform=iOS Simulator,id=$DEVICE" -resultBundlePath TestResults.xcresult CODE_SIGNING_ALLOWED=NO SWIFT_ENABLE_BATCH_MODE=NO OTHER_SWIFT_FLAGS="-Xfrontend -warn-long-expression-type-checking=500 -Xfrontend -warn-long-function-bodies=2000" test
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-results
          path: TestResults.xcresult
          retention-days: 7
