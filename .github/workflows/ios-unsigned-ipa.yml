name: Build unsigned iOS IPA

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Git ref to build (tag or branch)
        required: true
        default: v0.1.0-beta.1
        type: string
      release_tag:
        description: Existing GitHub prerelease to attach the IPA to
        required: true
        default: v0.1.0-beta.1
        type: string

permissions:
  contents: write

jobs:
  build-ipa:
    name: iOS 27 device build (unsigned)
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - name: Checkout requested source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}

      - name: Select Xcode 27
        run: |
          set -euo pipefail
          for candidate in /Applications/Xcode*.app; do
            version=$(DEVELOPER_DIR="$candidate/Contents/Developer" xcodebuild -version | sed -n '1p')
            if [[ "$version" == 'Xcode 27'* ]]; then
              echo "DEVELOPER_DIR=$candidate/Contents/Developer" >> "$GITHUB_ENV"
              exit 0
            fi
          done
          echo 'Xcode 27 is unavailable on this runner' >&2
          exit 1

      - name: Install project generator
        run: brew install xcodegen

      # The public VK ID client ID comes from scripts/write_secrets_xcconfig.sh, not a repository secret.
      - name: Generate Xcode project
        run: |
          set -euo pipefail
          bash scripts/write_secrets_xcconfig.sh
          xcodegen generate

      - name: Build Release app for iOS devices without signing
        run: |
          set -euo pipefail
          xcodebuild \
            -scheme VKHIG \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            build

      - name: Package and validate unsigned IPA
        id: package
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          APP_PATH="$GITHUB_WORKSPACE/build/DerivedData/Build/Products/Release-iphoneos/VK HIG.app"
          test -d "$APP_PATH"
          IPA_NAME="VKHIG-${RELEASE_TAG}-unsigned.ipa"
          PACKAGE_DIR="$RUNNER_TEMP/ipa-package"
          IPA_PATH="$GITHUB_WORKSPACE/$IPA_NAME"
          rm -rf "$PACKAGE_DIR"
          mkdir -p "$PACKAGE_DIR/Payload"
          ditto "$APP_PATH" "$PACKAGE_DIR/Payload/VK HIG.app"
          (cd "$PACKAGE_DIR" && /usr/bin/zip -X -qry "$IPA_PATH" Payload)
          /usr/bin/unzip -tq "$IPA_PATH"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PATH/Info.plist"
          shasum -a 256 "$IPA_PATH"
          echo "ipa_path=$IPA_PATH" >> "$GITHUB_OUTPUT"
          echo "ipa_name=$IPA_NAME" >> "$GITHUB_OUTPUT"

      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: VKHIG-unsigned-ipa
          path: ${{ steps.package.outputs.ipa_path }}
          if-no-files-found: error
          retention-days: 30

      - name: Attach unsigned IPA to prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          IPA_PATH: ${{ steps.package.outputs.ipa_path }}
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" >/dev/null
          gh release upload "$RELEASE_TAG" "$IPA_PATH" --clobber
