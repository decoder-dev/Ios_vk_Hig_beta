# XcodeGen project definition for VK HIG.
# On macOS: brew install xcodegen && xcodegen generate
# Then open VKHIG.xcodeproj
name: VKHIG
options:
  bundleIdPrefix: com.decoderdev
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: ru
settings:
  BASE_SDK: iphoneos
  SWIFT_VERSION: "5.10"
  TARGETED_DEVICE_FAMILY: "1,2"
  IPHONEOS_DEPLOYMENT_TARGET: "17.0"
targets:
  VKHIG:
    type: application
    platform: iOS
    sources:
      - path: VKHIG
        excludes:
          - "**/*.md"
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.decoderdev.vkhig
      PRODUCT_NAME: VK HIG
      INFOPLIST_FILE: VKHIG/Resources/Info.plist
      GENERATE_INFOPLIST_FILE: false
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      CURRENT_PROJECT_VERSION: 1
      MARKETING_VERSION: "0.1.0"
      SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: false
    info:
      path: VKHIG/Resources/Info.plist
      properties:
        CFBundleDisplayName: VK HIG
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
  VKHIGTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: VKHIGTests
    dependencies:
      - target: VKHIG
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.decoderdev.vkhig.tests
      GENERATE_INFOPLIST_FILE: true
      TEST_HOST: "$(BUILT_PRODUCTS_DIR)/VK HIG.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/VK HIG"
      BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  VKHIG:
    build:
      targets:
        VKHIG: all
        VKHIGTests: [test]
    test:
      targets:
        - VKHIGTests
    run:
      config: Debug
