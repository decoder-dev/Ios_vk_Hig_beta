# XcodeGen project definition for VK HIG.
# On macOS: brew install xcodegen && xcodegen generate
# Then open VKHIG.xcodeproj
name: VKHIG
options:
  bundleIdPrefix: com.decoderdev
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: ru
settings:
  BASE_SDK: iphoneos
  SWIFT_VERSION: "5.0"
  TARGETED_DEVICE_FAMILY: "1,2"
  IPHONEOS_DEPLOYMENT_TARGET: "17.0"
configFiles:
  Debug: VKHIG/Config/Shared.xcconfig
  Release: VKHIG/Config/Shared.xcconfig
targets:
  VKHIG:
    type: application
    platform: iOS
    sources:
      - path: VKHIG
        excludes:
          - "**/*.md"
          - "Config/Secrets.xcconfig"
    configFiles:
      Debug: VKHIG/Config/Shared.xcconfig
      Release: VKHIG/Config/Shared.xcconfig
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.decoderdev.vkhig
      PRODUCT_NAME: VK HIG
      PRODUCT_MODULE_NAME: VKHIG
      INFOPLIST_FILE: VKHIG/Resources/Info.plist
      GENERATE_INFOPLIST_FILE: false
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      CURRENT_PROJECT_VERSION: 2
      MARKETING_VERSION: "0.1.0"
      SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: false
      INFOPLIST_EXPAND_BUILD_SETTINGS: true

  VKHIGTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: VKHIGTests
    dependencies:
      - target: VKHIG
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.decoderdev.vkhig.tests
      GENERATE_INFOPLIST_FILE: true
      TEST_HOST: "$(BUILT_PRODUCTS_DIR)/VK HIG.app/VK HIG"
      BUNDLE_LOADER: "$(TEST_HOST)"
  VKHIGUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: VKHIGUITests
    dependencies:
      - target: VKHIG
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.decoderdev.vkhig.uitests
      GENERATE_INFOPLIST_FILE: true
      TEST_TARGET_NAME: VKHIG

schemes:
  VKHIG:
    build:
      targets:
        VKHIG: all
        VKHIGTests: [test]
        VKHIGUITests: [test]
    test:
      targets:
        - VKHIGTests
        - VKHIGUITests
    run:
      config: Debug
